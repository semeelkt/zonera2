<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Football Live Scores - Premium Sports</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #1a1a2e;
            --secondary-color: #16213e;
            --accent-color: #e94560;
            --accent-light: #00d4ff;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --border-color: rgba(255, 255, 255, 0.1);
            --success-color: #00d76f;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            background: rgba(22, 33, 62, 0.6);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            padding: 20px 0;
            margin-bottom: 40px;
            position: sticky;
            top: 0;
            z-index: 100;
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-light), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-icon {
            font-size: 28px;
        }

        .time-display {
            font-size: 14px;
            color: var(--text-secondary);
            background: var(--glass-bg);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 30px;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .search-box input::placeholder {
            color: var(--text-secondary);
        }

        .search-box input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent-light);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 11px 24px;
            background: var(--glass-bg);
            border: 2px solid var(--glass-border);
            color: var(--text-primary);
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        button:hover::before {
            width: 300px;
            height: 300px;
            animation: ripple 0.6s ease-out;
        }

        @keyframes ripple {
            0% {
                width: 0;
                height: 0;
                opacity: 1;
            }
            100% {
                width: 300px;
                height: 300px;
                opacity: 0;
            }
        }

        button:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--accent-light);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.15);
        }

        button:active {
            transform: translateY(-1px);
        }

        button.active {
            background: linear-gradient(135deg, var(--accent-light), var(--accent-color));
            border-color: var(--accent-color);
            color: #000;
            box-shadow: 0 12px 35px rgba(233, 69, 96, 0.4);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        button.active:hover {
            background: linear-gradient(135deg, var(--accent-light), var(--accent-color));
            box-shadow: 0 15px 45px rgba(233, 69, 96, 0.5);
            transform: translateY(-4px);
        }

        .refresh-btn {
            padding: 11px 16px;
        }

        .filter-count {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            margin-left: 6px;
            font-weight: 700;
        }

        button.active .filter-count {
            background: rgba(0, 0, 0, 0.3);
        }

        /* Main Content */
        .matches-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            animation: fadeIn 0.6s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .match-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .match-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .match-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent-light);
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(0, 212, 255, 0.2);
        }

        .match-card:hover::before {
            opacity: 1;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .league-name {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .match-status {
            font-size: 11px;
            padding: 6px 12px;
            border-radius: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-live {
            background: linear-gradient(135deg, var(--accent-color), #ff1744);
            color: white;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .status-finished {
            background: rgba(100, 100, 100, 0.3);
            color: var(--text-secondary);
        }

        .status-scheduled {
            background: rgba(0, 212, 255, 0.2);
            color: var(--accent-light);
        }

        .match-time {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .teams-container {
            margin: 20px 0;
            position: relative;
            z-index: 1;
        }

        .team {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0;
        }

        .team-name {
            font-weight: 700;
            font-size: 15px;
            flex: 1;
        }

        .score {
            font-size: 28px;
            font-weight: 800;
            color: var(--accent-light);
            margin: 0 15px;
            min-width: 50px;
            text-align: center;
        }

        .team-flag {
            font-size: 20px;
            margin-right: 8px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
        }

        .team-flag img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 4px;
        }

        .vs-text {
            text-align: center;
            color: var(--text-secondary);
            font-size: 12px;
            margin: 8px 0;
            font-weight: 600;
        }

        .match-footer {
            border-top: 1px solid var(--glass-border);
            padding-top: 12px;
            margin-top: 16px;
            font-size: 12px;
            color: var(--text-secondary);
            position: relative;
            z-index: 1;
        }

        .match-card.selected {
            border-color: var(--accent-light);
            box-shadow: 0 0 0 1px rgba(0, 212, 255, 0.35), 0 18px 44px rgba(0, 212, 255, 0.16);
        }

        .selected-match-panel {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 28px;
            backdrop-filter: blur(10px);
        }

        .selected-match-panel h2 {
            font-size: 18px;
            margin-bottom: 6px;
        }

        .selected-match-panel .panel-subtitle {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 18px;
        }

        .selected-match-placeholder {
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 24px;
            color: var(--text-secondary);
            text-align: center;
            font-size: 14px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }

        .detail-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px 14px;
        }

        .detail-chip .label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .detail-chip .value {
            font-size: 14px;
            font-weight: 700;
        }

        .analysis-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 18px;
        }

        .analysis-card {
            background: rgba(10, 14, 20, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px;
        }

        .analysis-card h3 {
            font-size: 15px;
            margin-bottom: 12px;
        }

        .probability-row {
            margin-bottom: 12px;
        }

        .probability-row:last-child {
            margin-bottom: 0;
        }

        .probability-row .topline {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 13px;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }

        .probability-track {
            height: 10px;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 999px;
            overflow: hidden;
        }

        .probability-fill {
            height: 100%;
            border-radius: inherit;
        }

        .probability-fill.home {
            background: linear-gradient(90deg, #00d266, #8cffc3);
        }

        .probability-fill.draw {
            background: linear-gradient(90deg, #8b92a1, #c2c7d0);
        }

        .probability-fill.away {
            background: linear-gradient(90deg, #0099ff, #74c9ff);
        }

        .ai-note {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 12px;
            line-height: 1.55;
        }

        .xi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }

        .xi-card {
            background: rgba(10, 14, 20, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px;
        }

        .xi-card h3 {
            font-size: 15px;
            margin-bottom: 4px;
        }

        .xi-card .formation {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .xi-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .xi-slot {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
        }

        .xi-role {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 700;
            min-width: 34px;
        }

        .xi-player {
            font-size: 13px;
            font-weight: 600;
            text-align: right;
            flex: 1;
        }

        .xi-tag {
            font-size: 11px;
            color: #0a0e14;
            background: var(--accent-light);
            border-radius: 999px;
            padding: 3px 8px;
            font-weight: 800;
            letter-spacing: 0.03em;
        }

        /* Loading Spinner */
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid var(--glass-border);
            border-top: 4px solid var(--accent-light);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            animation: fadeIn 0.6s ease-out;
        }

        .empty-icon {
            font-size: 60px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 20px;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .empty-text {
            color: var(--text-secondary);
        }

        /* Error Message */
        .error-banner {
            background: rgba(233, 69, 96, 0.2);
            border: 1px solid var(--accent-color);
            border-radius: 15px;
            padding: 16px 20px;
            margin-bottom: 20px;
            color: var(--accent-color);
            animation: slideDown 0.4s ease-out;
        }

        /* Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 16px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: var(--accent-light);
            background: rgba(255, 255, 255, 0.08);
        }

        .stat-number {
            font-size: 28px;
            font-weight: 800;
            color: var(--accent-light);
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .matches-container {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
                width: 100%;
            }

            .search-box {
                min-width: 100%;
            }

            .button-group {
                width: 100%;
            }

            button {
                flex: 1;
            }

            .stats-bar {
                grid-template-columns: repeat(2, 1fr);
            }

            .score {
                font-size: 24px;
            }

            .match-card {
                padding: 16px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }

            .team {
                flex-direction: column;
                text-align: center;
            }

            .team-name {
                margin: 8px 0;
            }

            .score {
                margin: 10px 0;
                font-size: 24px;
            }

            .stats-bar {
                grid-template-columns: 1fr;
            }

            button {
                width: 100%;
                padding: 10px 16px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">⚽</span>
                    <span>Football Scores</span>
                </div>
                <div class="time-display" id="timeDisplay">--:--</div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-number" id="liveCount">0</div>
                <div class="stat-label">Live Matches</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">Total Matches</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="finishedCount">0</div>
                <div class="stat-label">Finished</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="scheduledCount">0</div>
                <div class="stat-label">Scheduled</div>
            </div>
        </div>

        <div class="controls">
            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="🔍 Search teams, leagues..."
                >
            </div>
            <div class="button-group">
                <button class="filter-btn active" data-filter="all">All Matches <span class="filter-count" id="count-all">0</span></button>
                <button class="filter-btn" data-filter="live">Live <span class="filter-count" id="count-live">0</span></button>
                <button class="filter-btn" data-filter="finished">Finished <span class="filter-count" id="count-finished">0</span></button>
                <button class="filter-btn" data-filter="scheduled">Scheduled <span class="filter-count" id="count-scheduled">0</span></button>
                <button class="refresh-btn" id="refreshBtn" title="Refresh matches">🔄</button>
            </div>
        </div>

        <div id="errorBanner"></div>
        <div id="selectedMatchPanel" class="selected-match-panel"></div>
        <div id="matchesContainer" class="matches-container"></div>
    </div>

    <script>
        // API endpoints: allow override via `?api=` query param, otherwise try same-origin then fallbacks.
        const RELATIVE_API = '/api/matches';
        const LOCAL_API = 'http://127.0.0.1:5000/api/matches';
        const FILE_API = 'http://127.0.0.1:5000/api/matches';

        // If user provided ?api=<url> it will be used as primary API endpoint.
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }
        const API_OVERRIDE = (() => {
            const v = getQueryParam('api');
            if (!v) return null;
            try {
                // normalize: if path provided without /api/matches, append
                const parsed = new URL(v, window.location.href);
                if (!parsed.pathname || parsed.pathname === '/') parsed.pathname = '/api/matches';
                return parsed.href.replace(/\/$/, '') + (parsed.pathname.endsWith('/api/matches') ? '' : '/api/matches');
            } catch (e) {
                return null;
            }
        })();

        let allMatches = [];
        let currentFilter = 'all';
        let searchQuery = '';
        let autoRefreshInterval = null;

        // DOM Elements
        const matchesContainer = document.getElementById('matchesContainer');
        const errorBanner = document.getElementById('errorBanner');
        const selectedMatchPanel = document.getElementById('selectedMatchPanel');
        const refreshBtn = document.getElementById('refreshBtn');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const timeDisplay = document.getElementById('timeDisplay');

        const GEMINI_API_KEY = 'AIzaSyDCdGFkgDLE9f5vhLleGJVdcH0Ht_kgvS8';
        const GEMINI_MODEL = 'gemini-1.5-flash';

        let visibleMatches = [];
        let selectedMatchKey = '';
        let selectedInsightRequestId = 0;
        const insightCache = new Map();

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            setupEventListeners();
            renderSelectedMatchPanel(null);
            updateTime();
            setInterval(updateTime, 1000);
            fetchMatches();
            startAutoRefresh();
        });

        function setupEventListeners() {
            refreshBtn.addEventListener('click', () => {
                refreshBtn.style.animation = 'spin 1s linear';
                setTimeout(() => {
                    refreshBtn.style.animation = '';
                }, 1000);
                fetchMatches();
            });

            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase();
                filterAndDisplayMatches();
            });

            filterBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    filterAndDisplayMatches();
                });
            });

            matchesContainer.addEventListener('click', (e) => {
                const card = e.target.closest('.match-card');
                if (!card) return;

                const index = Number(card.dataset.matchIndex);
                const match = visibleMatches[index];
                if (match) {
                    selectMatch(match);
                }
            });
        }

        function updateTime() {
            const now = new Date();
            timeDisplay.textContent = now.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        async function fetchMatches() {
            showLoading();
            clearError();
            // If API override was provided in URL (?api=...), use it first.
            if (API_OVERRIDE) {
                try {
                    const resp = await fetch(API_OVERRIDE);
                    if (!resp.ok) throw new Error(`API override returned ${resp.status}`);
                    const data = await resp.json();
                    allMatches = data.matches || [];
                    filterAndDisplayMatches();
                    updateStats();
                    return;
                } catch (err) {
                    showError('⚠️ Failed to load matches from API override. Check the `api` query parameter.');
                    console.error('Fetch error (api override):', err);
                    return;
                }
            }
            // Choose order: if opened via file://, directly use local API.
            if (window.location.protocol === 'file:') {
                try {
                    const resp = await fetch(FILE_API);
                    if (!resp.ok) throw new Error('Local API returned non-ok');
                    const data = await resp.json();
                    allMatches = data.matches || [];
                    filterAndDisplayMatches();
                    updateStats();
                    return;
                } catch (err) {
                    showError('⚠️ Failed to load matches from local server. Make sure Python server is running on port 5000.');
                    console.error('Fetch error (file -> local):', err);
                    return;
                }
            }

            // When served from a web preview (codespaces / gh.dev), the origin may not proxy API requests.
            // Try same-origin first, then fall back to localhost.
            try {
                let response = null;

                try {
                    response = await fetch(RELATIVE_API);
                } catch (e) {
                    response = null;
                }

                if (!response || !response.ok) {
                    // fallback: try Codespaces/GH.dev host pattern by inserting '-5000' before '.app.github.dev'
                    const tryCodespacesHost = (port) => {
                        try {
                            const h = window.location.hostname;
                            if (h && h.endsWith('.app.github.dev')) {
                                const base = h.replace(/-\d+(?=\.app\.github\.dev$)/, '');
                                return `${window.location.protocol}//${base}-${port}.app.github.dev/api/matches`;
                            }
                            return `${window.location.protocol}//${window.location.hostname}:${port}/api/matches`;
                        } catch (e) {
                            return null;
                        }
                    };

                    const codespacesUrl = tryCodespacesHost(5000);
                    if (codespacesUrl) {
                        try {
                            response = await fetch(codespacesUrl);
                        } catch (e) {
                            response = null;
                        }
                    }

                    // final fallback to local Flask server
                    if (!response || !response.ok) {
                        try {
                            response = await fetch(LOCAL_API);
                        } catch (e) {
                            response = null;
                        }
                    }
                }

                if (!response) throw new Error('No response from API');
                if (!response.ok) throw new Error(`API responded with ${response.status}`);

                const data = await response.json();
                allMatches = data.matches || [];
                filterAndDisplayMatches();
                updateStats();
            } catch (error) {
                showError('⚠️ Failed to load matches. Make sure Python server is running on port 5000.');
                console.error('Fetch error:', error);
            }
        }

        function filterAndDisplayMatches() {
            let filtered = allMatches;

            // Apply status filter (map API statuses to filter names)
            if (currentFilter !== 'all') {
                filtered = filtered.filter(match => {
                    const apiStatus = match.status;
                    let filterStatus = currentFilter;

                    // Map API status to filter name
                    if (apiStatus === 'TIMED') filterStatus = 'scheduled';
                    else if (apiStatus === 'LIVE' || apiStatus === 'IN_PLAY') filterStatus = 'live';
                    else if (apiStatus === 'FINISHED') filterStatus = 'finished';

                    return filterStatus === currentFilter;
                });
            }

            // Apply search filter
            if (searchQuery) {
                filtered = filtered.filter(match => {
                    const homeTeam = match.homeTeam.name.toLowerCase();
                    const awayTeam = match.awayTeam.name.toLowerCase();
                    const league = match.competition.name.toLowerCase();
                    return homeTeam.includes(searchQuery) ||
                           awayTeam.includes(searchQuery) ||
                           league.includes(searchQuery);
                });
            }

            // Sort by status (LIVE first, then by date)
            filtered.sort((a, b) => {
                const statusOrder = { 'LIVE': 0, 'IN_PLAY': 0, 'FINISHED': 2, 'TIMED': 1 };
                if ((statusOrder[a.status] || 1) !== (statusOrder[b.status] || 1)) {
                    return (statusOrder[a.status] || 1) - (statusOrder[b.status] || 1);
                }
                return new Date(a.utcDate) - new Date(b.utcDate);
            });

            displayMatches(filtered);
        }

        function displayMatches(matches) {
            visibleMatches = matches;

            if (matches.length === 0) {
                matchesContainer.innerHTML = `
                    <div style="grid-column: 1/-1;">

                            <div class="empty-title">No matches found</div>
                            <div class="empty-text">Try adjusting your filters or search query</div>
                        </div>
                    </div>
                `;
                renderSelectedMatchPanel(null);
                return;
            }

            matchesContainer.innerHTML = matches.map((match, index) => createMatchCard(match, index)).join('');

            const selectedMatch = matches.find(match => getMatchKey(match) === selectedMatchKey);
            renderSelectedMatchPanel(selectedMatch || null);
        }

        function createMatchCard(match, index) {

            let status = apiStatus;

            if (apiStatus === 'TIMED') {
                status = 'SCHEDULED';
                statusText = 'SCHEDULED';
                statusClass = 'status-scheduled';
            } else if (apiStatus === 'LIVE' || apiStatus === 'IN_PLAY') {

            const matchMinute = match.minute ? `${match.minute}'` : '';

            const homeTeamLogo = summary.homeLogo || `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='50' font-size='60' text-anchor='middle' dy='.3em'%3E⚽%3C/text%3E%3C/svg%3E`;

            const isSelected = getMatchKey(match) === selectedMatchKey;

            return `

        function getMatchKey(match) {
            const homeTeam = match.homeTeam?.name || match.homeTeam || 'home';

            const leagueName = match.competition?.name || match.league?.name || 'league';
            const kickoff = match.utcDate || match.time || '';
            return `${homeTeam}|${awayTeam}|${leagueName}|${kickoff}`.toLowerCase();

        function escapeHtml(value) {
            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function normalizeMatchForDetails(match) {
            const apiStatus = match.status;
            let statusText = apiStatus;

            if (apiStatus === 'TIMED') {
                statusText = 'Scheduled';
            } else if (apiStatus === 'LIVE' || apiStatus === 'IN_PLAY') {
                statusText = match.minute ? `Live • ${match.minute}'` : 'Live';
            } else if (apiStatus === 'FINISHED') {
                statusText = 'Finished';
            }

            return {
                homeName: match.homeTeam?.name || 'Home Team',
                awayName: match.awayTeam?.name || 'Away Team',
                leagueName: match.competition?.name || 'League',
                country: match.competition?.area?.name || 'Unknown',
                kickoff: new Date(match.utcDate),
                statusText,
                homeScore: match.score?.fullTime?.home ?? '-',
                awayScore: match.score?.fullTime?.away ?? '-'

        }

        function seededNumber(seedValue, min, max) {
            let seed = 0;
            const input = String(seedValue);

            for (let index = 0; index < input.length; index += 1) {
                seed = (seed * 31 + input.charCodeAt(index)) >>> 0;
            }

            const range = max - min + 1;
            return min + (seed % range);
        }

        function homeScoreGuess(strength) {
            return Math.max(0, Math.min(4, Math.round((strength - 40) / 12)) + 1);
        }

        function awayScoreGuess(strength) {
            return Math.max(0, Math.min(3, Math.round((strength - 40) / 14)));
        }

        function generateLineup(teamName, side) {
            const roles = ['GK', 'RB', 'CB', 'CB', 'LB', 'DM', 'CM', 'CM', 'RW', 'ST', 'LW'];
            const tags = ['Anchor', 'Control', 'Press', 'Run', 'Cover', 'Link', 'Tempo', 'Drive', 'Width', 'Finish', 'Support'];
            const firstNames = ['Marco', 'Thomas', 'Florian', 'Manuel', 'Stefan', 'Pascal', 'Niklas', 'Jérôme', 'Alexis', 'Emiliano', 'Kerem', 'Jude', 'Mason', 'Declan', 'Reece', 'Luke', 'Vinicius', 'Neymar', 'Rodri', 'Gavi', 'Xavi', 'Iniesta', 'Antoine', 'Kylian', 'Sergio', 'Edin', 'Robert', 'Erling', 'Harry', 'Mohamed'];
            const lastNames = ['Neuer', 'Müller', 'Kroos', 'Reus', 'Hummels', 'Kimmich', 'Silva', 'Akanji', 'Özil', 'Sané', 'Sterling', 'Grealish', 'Kane', 'Mount', 'James', 'Bellinghan', 'Vinícius', 'Benzema', 'Gómez', 'Pedri', 'Alba', 'Busquets', 'Griezmann', 'Mbappé', 'Ramos', 'Dzeko', 'Lewandowski', 'Håland', 'Kane', 'Salah'];

            let seed = 0;
            for (let i = 0; i < teamName.length; i++) {
                seed = (seed * 31 + teamName.charCodeAt(i)) >>> 0;
            }

            return roles.map((role, index) => {
                const playerSeed = seed + index + (side === 'home' ? 0 : 1000);
                const firstName = firstNames[playerSeed % firstNames.length];
                const lastName = lastNames[(playerSeed * 7) % lastNames.length];

                return {
                    role,
                    player: `${firstName} ${lastName}`,
                    tag: tags[index]
                };
            });
        }

        function generateProbability(match) {
            const summary = normalizeMatchForDetails(match);
            const homeStrength = seededNumber(`${summary.homeName}-${summary.leagueName}`, 42, 74);
            const awayStrength = seededNumber(`${summary.awayName}-${summary.leagueName}`, 42, 74);
            const statusBoost = summary.statusText.startsWith('Live') ? 7 : summary.statusText === 'Finished' ? 4 : 0;
            const balance = homeStrength - awayStrength + statusBoost;

            let home = 38 + balance * 1.15;
            let away = 38 - balance * 1.1;
            let draw = 24 + (10 - Math.min(10, Math.abs(balance)));

            if (summary.statusText.startsWith('Live') && summary.homeScore !== '-' && summary.awayScore !== '-') {
                const scoreDiff = Number(summary.homeScore) - Number(summary.awayScore);
                home += scoreDiff * 4;
                away -= scoreDiff * 4;
                draw -= Math.abs(scoreDiff) * 2;
            }

            const total = Math.max(1, home + away + draw);
            home = Math.max(5, Math.round((home / total) * 100));
            away = Math.max(5, Math.round((away / total) * 100));
            draw = Math.max(5, 100 - home - away);

            if (home + away + draw !== 100) {
                draw += 100 - (home + away + draw);
            }

            const confidence = Math.min(92, Math.max(55, 61 + Math.abs(homeStrength - awayStrength)));
            const predictedScore = home >= away
                ? `${homeScoreGuess(homeStrength)}-${awayScoreGuess(awayStrength)}`
                : `${awayScoreGuess(awayStrength)}-${homeScoreGuess(homeStrength)}`;

            return {
                home,
                draw,
                away,
                confidence,
                predictedScore,
                homeLineup: generateLineup(summary.homeName, 'home'),
                awayLineup: generateLineup(summary.awayName, 'away'),
                stadium: `${summary.leagueName} Arena`,
                attendance: seededNumber(`${summary.homeName}-${summary.awayName}-attendance`, 12500, 78500),
                referee: `${summary.leagueName} Official`,
                weather: 'Clear',
                predictedScorers: [
                    {
                        player: `${summary.homeName.split(' ')[0]} Forward`,
                        team: summary.homeName,
                        minute: '24'
                    },
                    {
                        player: `${summary.awayName.split(' ')[0]} Striker`,

                    }
                ],
                keyNotes: [
                    `${summary.homeName} expected to press early`,
                    `${summary.awayName} likely to counter in transition`,
                    'Set pieces could decide the match'
                ]
            };
        }

        function normalizeInsightPayload(payload, match) {
            const summary = normalizeMatchForDetails(match);
            const fallback = generateProbability(match);
            const toPercent = value => {
                const parsed = Number(value);
                return Number.isFinite(parsed) ? Math.max(0, Math.min(100, Math.round(parsed))) : null;
            };

            const home = toPercent(payload?.probabilities?.home ?? payload?.home);
            const draw = toPercent(payload?.probabilities?.draw ?? payload?.draw);
            const away = toPercent(payload?.probabilities?.away ?? payload?.away);

            const safeHome = home ?? fallback.home;
            const safeDraw = draw ?? fallback.draw;
            const safeAway = away ?? fallback.away;
            const total = safeHome + safeDraw + safeAway || 100;

            const normalizedHome = Math.max(5, Math.round((safeHome / total) * 100));
            const normalizedAway = Math.max(5, Math.round((safeAway / total) * 100));
            const normalizedDraw = Math.max(5, 100 - normalizedHome - normalizedAway);
            const predictedScore = String(payload?.predictedScore || fallback.predictedScore);
            const confidence = toPercent(payload?.confidence) ?? fallback.confidence;
            const attendance = Number.isFinite(Number(payload?.attendance))
                ? Math.max(0, Math.round(Number(payload.attendance)))
                : fallback.attendance;
            const stadium = String(payload?.stadium || fallback.stadium);
            const referee = String(payload?.referee || fallback.referee);
            const weather = String(payload?.weather || fallback.weather);

            const lineupFromPayload = side => {
                return side === 'home' ? fallback.homeLineup : fallback.awayLineup;
            };

            return {
                home: normalizedHome,
                draw: normalizedDraw,
                away: normalizedAway,
                confidence,
                predictedScore,
                headline: String(payload?.headline || `${summary.homeName} vs ${summary.awayName}`),
                commentary: String(payload?.commentary || 'Match analysis in progress...'),
                summary: String(payload?.summary || 'Detailed match summary will be displayed here'),
                tactics: String(payload?.tactics || 'Tactical approach: balanced play expected'),
                modelNote: String(payload?.modelNote || payload?.note || 'AI-projected tactical balance'),
                homeLineup: lineupFromPayload('home'),
                awayLineup: lineupFromPayload('away')
                ,
                stadium,
                attendance,
                referee,
                weather,
                predictedScorers: Array.isArray(payload?.predictedScorers) && payload.predictedScorers.length > 0
                    ? payload.predictedScorers.slice(0, 4).map((entry, index) => ({
                        player: String(entry?.player || entry?.name || `Scorer ${index + 1}`),
                        team: String(entry?.team || entry?.club || (index % 2 === 0 ? summary.homeName : summary.awayName)),
                        minute: String(entry?.minute || entry?.time || `${20 + index * 15}`)
                    }))
                    : fallback.predictedScorers,
                keyNotes: Array.isArray(payload?.keyNotes) && payload.keyNotes.length > 0
                    ? payload.keyNotes.slice(0, 3).map(note => String(note))
                    : fallback.keyNotes
            };
        }

  "probabilities": {"home": number, "draw": number, "away": number},
  "confidence": number,
  "predictedScore": "0-0",
  "modelNote": "short sentence",
  "stadium": "stadium name",
  "attendance": number,
  "referee": "official name",
  "weather": "short weather description",
  "predictedScorers": [{"player": "...", "team": "...", "minute": "..."}],
  "keyNotes": ["short note 1", "short note 2", "short note 3"]
}

Rules:
- probabilities must add to 100
- confidence must be 0-100
- predictedScorers should include 2 to 4 likely scorers with approximate goal minutes
- keep stadium, referee, and weather concise and realistic
- use the teams and match context to infer the tactical shape
- headline should be engaging and descriptive of the match situation
- commentary should reflect the current match status (live, finished, or scheduled)`;

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    contents: [{ role: 'user', parts: [{ text: prompt }] }],
                    generationConfig: {
                        temperature: 0.7,
                        responseMimeType: 'application/json'
                    }
                })
            });

            if (!response.ok) {
                throw new Error(`Gemini request failed: ${response.status}`);
            }

            const data = await response.json();
            const rawText = data?.candidates?.[0]?.content?.parts?.map(part => part.text || '').join('') || '';
            const jsonText = rawText.match(/\{[\s\S]*\}/)?.[0] || rawText;
            const parsed = JSON.parse(jsonText);
            const normalized = normalizeInsightPayload(parsed, match);
            insightCache.set(cacheKey, normalized);
            return normalized;
        }

        function renderSelectedMatchPanel(match) {
            if (!selectedMatchPanel) return;

            if (!match) {
                selectedMatchPanel.innerHTML = `
                    <h2>AI match insight</h2>
                    <div class="panel-subtitle">Select a match to see the AI-generated probability, probable XI, and match details.</div>
                    <div class="selected-match-placeholder">No match selected yet. Click any match card to open the prediction panel.</div>
                `;
                return;
            }

            const summary = normalizeMatchForDetails(match);
            const kickoffText = Number.isNaN(summary.kickoff.getTime())
                ? 'TBA'
                : summary.kickoff.toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            summary.kickoffText = kickoffText;

            const requestId = ++selectedInsightRequestId;
            selectedMatchPanel.innerHTML = buildLoadingInsightMarkup(summary);

            void (async () => {
                try {
                    const insight = await fetchGeminiInsight(match);
                    if (requestId !== selectedInsightRequestId || getMatchKey(match) !== selectedMatchKey) {
                        return;
                    }

                    selectedMatchPanel.innerHTML = buildInsightMarkup(summary, insight);
                } catch (error) {
                    console.warn('Gemini insight failed, using fallback:', error);
                    if (requestId !== selectedInsightRequestId || getMatchKey(match) !== selectedMatchKey) {
                        return;
                    }

                    const fallback = generateProbability(match);
                    selectedMatchPanel.innerHTML = buildInsightMarkup(summary, fallback);
                }
            })();
        }

        function selectMatch(match) {
            selectedMatchKey = getMatchKey(match);
            renderSelectedMatchPanel(match);
            displayMatches(visibleMatches);
            selectedMatchPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function updateStats() {
            const live = allMatches.filter(m => m.status === 'LIVE' || m.status === 'IN_PLAY').length;
            const finished = allMatches.filter(m => m.status === 'FINISHED').length;
            const scheduled = allMatches.filter(m => m.status === 'TIMED').length;
            const total = allMatches.length;

            document.getElementById('liveCount').textContent = live;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('finishedCount').textContent = finished;
            document.getElementById('scheduledCount').textContent = scheduled;

            // Update filter button counters
            document.getElementById('count-all').textContent = total;
            document.getElementById('count-live').textContent = live;
            document.getElementById('count-finished').textContent = finished;
            document.getElementById('count-scheduled').textContent = scheduled;
        }

        function showLoading() {
            matchesContainer.innerHTML = `
                <div style="grid-column: 1/-1;">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            `;
        }

        function showError(message) {
            errorBanner.innerHTML = message;
            errorBanner.style.display = 'block';
        }

        function clearError() {
            errorBanner.innerHTML = '';
            errorBanner.style.display = 'none';
        }

        function startAutoRefresh() {
            autoRefreshInterval = setInterval(() => {
                fetchMatches();
            }, 60000); // Refresh every 60 seconds
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
        });
    </script>
</body>
</html>
